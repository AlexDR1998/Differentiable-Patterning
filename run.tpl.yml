apiVersion: batch/v1
kind: Job
metadata:
    generateName: $USER-
    labels:
      eidf/user: $USER
      kueue.x-k8s.io/queue-name: $KUBE_USER_QUEUE
spec:
    completions: 1
    template:
        metadata:
            labels:
              eidf/user: $USER
        spec:
            restartPolicy: Never
            containers:
            - name: differentiable-patterning
              image: alexdr1998/jax_equinox_scratch:latest
              imagePullPolicy: Always
              command: ["bash","/mnt/ceph/ar-dp/run_multi_gpu.sh"]
              args: ["${JOB_PATH_TO_PYTHON_SCRIPT}"]
              env:
              - name: MY_USERNAME
                value: $USER
              - name: MY_EXPERIMENT 
                value: experiment1
              - name: JOB_COMPLETION_INDEX
                value: "$(JOB_COMPLETION_INDEX)"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
                - name: writeable
                  mountPath: /workspace/writeable
              resources:
                requests:
                  cpu: 8
                  memory: "80Gi"
                limits:
                  cpu: 8
                  memory: "80Gi"
                  nvidia.com/gpu: 1
            nodeSelector:
                nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
            volumes:
              - name: workspace
                nfs:
                  server: $EIDF107_USER_DATA_NFS_HOST_IP
                  path: $WORKING_DIR
              - name: writeable
                persistentVolumeClaim:
                  claimName: $USER-ws1


