schema_version: 1
seed: 0

experiment:
  name: nca_micropattern_template

system:
  precision: highest
  xla_flags: null

# Descriptive W&B metadata. These values do not configure JAX or the model.
labels:
  scaling: convective
  gpu: null
data:
  dataset: micropatterns
  batches: 2
  downsample: 1
  micropattern:
    pool_copies: 1
  # Null loads all experiment groups for the selected dataset.
    experiment_groups: null
    timesteps: [0, 12, 24, 36, 48]
  # For legacy micropatterns this is 4 or 12. For 260726 it must match the
  # selected experiment groups' measurement-channel count.
    data_channels: 12
  # Null retains the historical six-pixel border on each side. Set an integer
  # to pad each spatial dimension symmetrically to that multiple.
    pad_multiple: null
    noise_strength: 0.005
  # Per-slot Bernoulli reinjection schedule. Equal start/end values give a
  # constant rate; e.g. 0.5 and 0.5 approximates the historical 50% policy.
    intermediate_reinjection_probability: 0.5
    intermediate_reinjection_probability_end: 0.5
    intermediate_reinjection_decay_start_fraction: 0.25
    duplicate_final_timestep: false

model:
  family: NCA
  channels: 32
  kernel_str: [ID, LAP, DIFF]
  fire_rate: 0.5
  padding: CIRCULAR

trainer:
  boundary_mode: soft
  grad_loss: false
  sharding: null
  backend:
    type: none
  log_directory: logs/
  loss_time_channel_mask: null
  loop_autodiff: checkpointed
  log_every: 100
  pool_admission_enabled: true
  pool_admission_relative_threshold: 1.25
  pool_admission_previous_relative_threshold: 1.10
  pool_admission_absolute_threshold: null
  pool_admission_ema_decay: 0.95
  pool_admission_warmup: null

optimiser:
  type: nadam
  blocknorm: true
  sam: false
  gradient_clip_norm: 1.0
  apply_if_finite: true
  max_consecutive_errors: 8
  learn_rate: 0.001
  warmup_steps: 64
  decay_rate: 0.99
  schedule:
    type: exponential
    warmup_init_lr: 1e-6
    # Cosine ends at learn_rate * final_factor. Late-step switches to
    # learn_rate * final_factor at transition_fraction of post-warmup training.
    final_factor: 0.1
    transition_fraction: 0.75

loss:
  terms:
    - type: l2
      weight: 1.0

  regularisers:
    intermediate_state: 1.0
    boundary: 5.0
    contiguous_growth: 0.0
    localised_hidden: 0.0
    update_sensitivity: 0.0
    perturbation_conservation: 0.0
    hidden_state_size: 0.0
run:
  mode: train
  t: 32
  iterations: 2000
  warmup: 64
  write_images: true

logging:
  backend: wandb
  singular_values:
    enabled: false
    plot_spectra: true
    epsilon: 1e-8
  wandb:
    project: NCA-micropattern
    group: base-config
    tags: null

# Publish the best checkpoint with this resolved config and provenance. The
# SQLite catalogue is rebuilt separately, so concurrent jobs never share it.
model_store:
  enabled: true
  root: models
  collection: ${logging.wandb.project}
  model_factory: Experiments.config_helpers:build_model

knockout:
  mode: null
  time: null
  channel: Nodal
