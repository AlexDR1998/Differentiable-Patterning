seed: 0

experiment:
  name: nca_micropattern_template
data:
  dataset: micropatterns
  batches: 2
  batch_multiplier: 1
  # Null loads all experiment groups for the selected dataset.
  experiment_groups: null
  timesteps: [0, 12, 24, 36, 48]
  # For legacy micropatterns this is 4 or 12. For 260726 it must match the
  # selected experiment groups' measurement-channel count.
  data_channels: 12
  downsample: 1
  # Null retains the historical six-pixel border on each side. Set an integer
  # to pad each spatial dimension symmetrically to that multiple.
  pad_multiple: null
  noise_strength: 0.005
  duplicate_final_timestep: false

model:
  family: NCA
  channels: 32
  kernel_str: [ID, LAP, DIFF]
  fire_rate: 0.5
  padding: CIRCULAR

trainer:
  boundary_mode: soft
  grad_loss: false
  sharding: null
  # Sequential NCA timesteps grouped inside each SYCL custom call. A value of
  # 1 uses the unfused one-step path. Ignored by non-SYCL model families.
  sycl_fused_steps: 2
  # Wait for fused native rollout calls before returning to XLA. Useful for
  # diagnosing custom-call/collective ordering on Intel GPUs.
  sycl_synchronize_custom_calls: false
  # Diagnostic mode: wait and report asynchronous SYCL errors after each
  # native forward/backward stage. This is intentionally expensive.
  sycl_strict_stage_synchronization: false
  # Fused regulariser accumulation: historical global atomics or deterministic
  # workgroup partials followed by a second reduction kernel.
  sycl_regulariser_reduction: atomic
  # Diagnostic switches. Disabling loss pmean also removes the corresponding
  # reverse-mode gradient collective and is not numerically equivalent.
  sycl_pmean_loss: true
  sycl_pmean_regularisers: true
  # Serialize native calls from both tiles with a process-wide mutex. This is
  # intentionally slow and distinguishes custom-call concurrency from sharding.
  sycl_serialize_custom_calls: false
  model_directory: models/
  log_directory: logs/
  loss_time_channel_mask: null
  loop_autodiff: checkpointed
  clear_cache_every: 500
  log_every: 100
  pool_admission_enabled: true
  pool_admission_relative_threshold: 1.25
  pool_admission_previous_relative_threshold: 1.10
  pool_admission_absolute_threshold: null
  pool_admission_ema_decay: 0.95
  pool_admission_warmup: null

optimiser:
  type: nadam
  blocknorm: true
  sam: false
  gradient_clip_norm: 1.0
  apply_if_finite: true
  max_consecutive_errors: 8
  learn_rate: 0.001
  warmup_steps: 64
  decay_rate: 0.99
  schedule:
    type: exponential
    warmup_init_lr: 1e-6
    # Cosine ends at learn_rate * final_factor. Late-step switches to
    # learn_rate * final_factor at transition_fraction of post-warmup training.
    final_factor: 0.1
    transition_fraction: 0.75

loss:
  primary: l2
  # Optional weights aligned with target-data channels and loss.primary.
  # Null preserves uniform channel importance and equal loss-component weighting.
  channel_importance: null
  component_weights: null
  regulariser_coeffs:
    intermediate_state: 1.0
    boundary: 5.0
    contiguous_growth: 0.0
    update_sensitivity: 0.0
    perturbation_conservation: 0.0
    latent_channel_match: 0.0
    latent_size: 0.0
  random_crop: true
  random_channel_shuffle: false
  args:
    channels: null
    experiment_groups: null
    S: 1024
    K: 5
    D: 4
    sharpen: true
    epsilon: 0.1
    internal_loss_func: l2
    samples: 128

run:
  mode: train
  t: 32
  iterations: 2000
  warmup: 64
  write_images: true
  sparse_pruning: false
  target_sparsity: 0.5

logging:
  backend: wandb
  singular_values:
    enabled: false
    plot_spectra: true
    epsilon: 1e-8
  wandb:
    project: NCA-micropattern
    group: base-config
    tags: null

knockout:
  time: null
  channel: Nodal
