# Cell-type rules made with Experiments/micropatterns/nodal_ko_eval.py.
# A marker is high where its normalised (0-1) value is above its
# threshold; a cell type needs every listed marker state (any = not
# checked) of at least one of its clauses (a list means "or"),
# counted with the clause weights under clause_weights (1 if absent).
# Stains list the markers imaged together in the same colony. The
# thresholds hold for images processed with the data.micropattern
# settings under preprocessing.
format: cell_type_rules_v2
hour: 48
markers:
  SOX17:
    channel: cell_fate_s1/SOX17
    threshold: 0.2
  SOX2:
    channel: cell_fate_s1/SOX2
    threshold: 0.08
  TBXT:
    channel: cell_fate_s2/TBXT
    threshold: 0.13
  FOXA2:
    channel: cell_fate_s2/FOXA2
    threshold: 0.13
stains:
  cell_fate_s1:
    SOX17: cell_fate_s1/SOX17
    SOX2: cell_fate_s1/SOX2
    TBXT: cell_fate_s1/TBXT
  cell_fate_s2:
    TBXT: cell_fate_s2/TBXT
    FOXA2: cell_fate_s2/FOXA2
cell_types:
  Notochord:
    SOX17: low
    SOX2: any
    TBXT: high
    FOXA2: high
  Endoderm:
    SOX17: high
    SOX2: any
    TBXT: any
    FOXA2: any
  Mesoderm:
  - SOX17: low
    SOX2: any
    TBXT: high
    FOXA2: low
  - SOX17: any
    SOX2: high
    TBXT: high
    FOXA2: any
clause_weights:
  Mesoderm:
  - 1.0
  - 0.0
preprocessing:
  projection: slice
  tuned_on: NCA rollouts (every marker in every pixel)
