    system:
      precision: highest
      xla_flags: null
    labels:
      scaling: convective
      gpu: intel
    data:
      dataset: micropatterns_260726
      batches: 1
      downsample: 16
      micropattern:
        pool_copies: 4
        experiment_groups:
        - cell_fate_s1
        - cell_fate_s2
        timesteps:
        - 0
        - 12
        - 24
        - 36
        - 48
        data_channels: 8
        pad_multiple: null
        noise_strength: 0.005
        intermediate_reinjection_probability: 1.0
        intermediate_reinjection_probability_end: 0.0
        intermediate_reinjection_decay_start_fraction: 0.01
        duplicate_final_timestep: false
        task: micropattern_single_replicate
    model:
      family: gNCA_sycl
      channels: 48
      kernel_str:
      - ID
      - LAP
      - DIFF
      fire_rate: 0.5
      padding: CIRCULAR
    trainer:
      boundary_mode: soft
      grad_loss: false
      sharding: null
      backend:
        type: sycl
      log_directory: logs/
      loss_time_channel_mask: null
      loop_autodiff: lax
      log_every: 200
      pool_admission_enabled: true
      pool_admission_relative_threshold: 1.25
      pool_admission_previous_relative_threshold: 1.1
      pool_admission_absolute_threshold: null
      pool_admission_ema_decay: 0.95
      pool_admission_warmup: null
    optimiser:
      type: nadam
      blocknorm: true
      sam: false
      gradient_clip_norm: 1.0
      apply_if_finite: true
      max_consecutive_errors: 16
      learn_rate: 0.001
      warmup_steps: 64
      decay_rate: 0.1
      schedule:
        type: cosine
        warmup_init_lr: 1.0e-06
        final_factor: 0.5
        transition_fraction: 0.75
    loss:
      terms:
      - type: multi_target
        multi_target_weights:
          l2: 1.0
          texture: 1.0
          channel_mean: 0.0
          correlation: 0.0
          radial: 0.0
        normalize_weights: true
        assignment: hard
        random_crop: false
        random_channel_shuffle: true
        multi_target_schedules:
          l2:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          texture:
            type: cosine
            initial_factor: 1.0
            final_factor: 0.25
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          channel_mean:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          correlation:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          radial:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
      regularisers:
        intermediate_state: 10.0
        boundary: 10.0
        contiguous_growth: 0.0
        localised_hidden: 0.0
        update_sensitivity: 0.0
        perturbation_conservation: 0.0
        hidden_state_size: 0.0
      schedule_label: cos_reverse
    run:
      mode: train
      t: 128
      iterations: 12000
      warmup: 64
      write_images: true
      repeat: 4
    logging:
      backend: wandb
      singular_values:
        enabled: true
        plot_spectra: true
        epsilon: 1.0e-08
      wandb:
        project: nca_micropattern_loss_schedules
        group: nca_micropattern_loss_schedule_l2_sweep_v4
        tags: null
    model_store:
      enabled: true
      root: models
      collection: NCA-micropattern
      model_factory: Experiments.config_helpers:build_model
    knockout:
      mode: null
      time: null
      channel: Nodal
emit_files: false
