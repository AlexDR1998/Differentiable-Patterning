      kernel_str:
      - ID
      - GRAD
      - LAP
      fire_rate: 0.5
      padding: CIRCULAR
      signal_mode: axon
      signal_channels: 4
      signal_substeps: 16
    trainer:
      boundary_mode: soft
      grad_loss: false
      log_directory: logs/
