      sam: false
      gradient_clip_norm: 1.0
      apply_if_finite: true
      max_consecutive_errors: 8
      learn_rate: 0.0001
      warmup_fraction: 0.032
      decay_rate: 0.99
      schedule:
        type: exponential
        warmup_init_lr: 1.0e-06
        final_factor: 0.1
        transition_fraction: 0.75
    loss:
      terms:
      - type: multi_target
        random_channel_shuffle: true
        multi_target_weights:
          l2: 1.0
          texture: 0.0
          channel_mean: 0.0
          correlation: 0.0
          radial: 0.0
        multi_target_schedules:
          l2:
            type: constant
          texture:
            type: cosine
            initial_factor: 1.0
            final_factor: 0.25
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          channel_mean:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          correlation:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
          radial:
            type: cosine
            initial_factor: 0.05
            final_factor: 1.0
            start_fraction: 0.3
            end_fraction: 0.75
            stages: 8
      regularisers:
        intermediate_state: 1.0
        boundary: 5.0
        contiguous_growth: 0.0
        localised_hidden: 0.0
        update_sensitivity: 0.0
        perturbation_conservation: 0.0
        hidden_state_size: 0.0
      schedule_label: cos_reverse
    run:
      mode: train
      t: 256
      iterations: 16000
      checkpoint_warmup_fraction: 0.032
      write_images: true
      write_videos: false
      repeat: 1
    logging:
      backend: wandb
      singular_values:
        enabled: false
        plot_spectra: true
        epsilon: 1.0e-08
      wandb:
        project: nca_micropattern_ablations
        group: nca_micropattern_ablations_v1
        tags: null
        tag_keys:
        - labels.ablation
        - run.repeat
        - loss.terms.0.multi_target_weights
        - loss.terms.0.multi_target_schedules.l2
        - loss.terms.0.multi_target_schedules.texture
        - loss.terms.0.multi_target_schedules.radial
        - data.micropattern.train_replicates
        - data.micropattern.validation_replicates
    model_store:
      enabled: true
      root: models
      collection: NCA-micropattern
      model_factory: NCA.model.factory:build_model
    initialization:
      model_id: null
emit_files: false
