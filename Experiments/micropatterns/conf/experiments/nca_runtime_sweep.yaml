experiment_name: intel_nvidia_baseline_nca_runtime
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/intel_nvidia_baseline_nca_runtime_intel
seed_mode: fixed
grid:
  run.mode: [benchmark]
  # model.family: [NCA]
  model.family: [NCA_sycl]
  model.channels: [32]
  run.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [intel_nvidia_baseline_nca_runtime_shard_kernel_reg_2]
  run.iterations: [100]
  # Runtime measurements exclude the full-trajectory evaluation renderer.
  run.write_images: [false]
  loss.primary: [[l2_grouped]]
  loss.layers: [[decoded]]
  loss.vgg_internal: [l2]
  trainer.loop_autodiff: [checkpointed,lax]
  data.downsample: [2,4]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regulariser_coeffs.boundary: [0.0,1.0]
  loss.regulariser_coeffs.latent_channel_match: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0,1.0]
  loss.regulariser_coeffs.latent_size: [0.0]
  loss.regulariser_coeffs.intermediate_state: [0.0,1.0]
  loss.random_crop: [False]
  model.upscale_factor: [1]
  run.t: [128]
  model.upsampler.radius: [null]
  model.upsampler.depth: [null]
  model.upsampler.width_factor: [null]
  # system.precision: [highest,bfloat16,tensorfloat32]
  system.gpu: [intel]
  optimiser.type: [nadam]
  # system.xla_flags: ["--xla_gpu_enable_latency_hiding_scheduler=true", "--xla_gpu_enable_latency_hiding_scheduler=true --xla_gpu_triton_gemm_any=True", "--xla_gpu_triton_gemm_any=True", "--xla_gpu_enable_command_buffer=FUSION"]
  # system.xla_flags: [[triton_gemm],[latency_hiding_scheduler],[command_buffer],[triton_gemm,latency_hiding_scheduler],null]
  system.xla_flags: [null]
  seed: [5678]
  # system.xla_flags: [null]
  # system.xla_flags: [null]
  # system.xla_flags: ["--xla_gpu_enable_latency_hiding_scheduler=true"]
  

# groups:
  # - model.upscale_factor: [16,8,4,2]
    # run.t : [16,32,64,128]    
branches:
  - when:
      model.family: NCA
    grid:
      system.precision: [highest,bfloat16]
  - when:
      model.family: NCA_fast
    grid:
      system.precision: [highest,bfloat16]
  - when:
      model.family: NCA_sycl
    grid:
      system.precision: [bfloat16]
      # Fused step counts must divide run.t.
      trainer.sycl_fused_steps: [1,2,4,8,16]
      trainer.sharding: [2]
