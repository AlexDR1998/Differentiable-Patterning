experiment_name: intel_debug_basic
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/intel_debug_basic
seed_mode: index
grid:
  run.mode: [benchmark]
  model.family: [NCA]
  model.channels: [32]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [intel_debug_basic]
  run.iterations: [8]
  loss.terms: [[vgg_grouped,l2_grouped]]
  loss.terms.0.metric: [l2]
  trainer.loop_autodiff: [checkpointed]
  data.downsample: [2]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]
  loss.regularisers.intermediate_state: [0.0]
  loss.terms.0.random_crop: [False]
  run.t: [128]
  system.precision: [highest,bfloat16,tensorfloat32]
  labels.gpu: [intel]
  # system.xla_flags: ["--xla_gpu_enable_latency_hiding_scheduler=true", "--xla_gpu_enable_latency_hiding_scheduler=true --xla_gpu_triton_gemm_any=True", "--xla_gpu_triton_gemm_any=True", "--xla_gpu_enable_command_buffer=FUSION"]
  # system.xla_flags: [[triton_gemm],[latency_hiding_scheduler],[command_buffer],[triton_gemm,latency_hiding_scheduler],null]
  system.xla_flags: [null]
