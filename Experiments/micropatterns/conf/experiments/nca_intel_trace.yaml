experiment_name: intel_sycl_trace_1
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/intel_sycl_trace_1
seed_mode: fixed
grid:
  run.mode: [benchmark]
  # model.family: [NCA, NCA_sycl]
  model.family: [NCA_sycl]
  trainer.backend.type: [sycl]
  model.channels: [32]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [intel_sycl_trace_1]
  run.iterations: [100]
  loss.terms: [[l2_grouped],[vgg_grouped]]
  trainer.loop_autodiff: [checkpointed]
  trainer.sharding: [2]
  trainer.backend.fused_steps: [2]
  trainer.jax_trace: [false]
  data.downsample: [4]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]
  loss.regularisers.intermediate_state: [0.0]
  run.t: [64]
  system.precision: [bfloat16]
  labels.gpu: [intel]
  optimiser.type: [nadam]

  system.xla_flags: [null]
  seed: [5678]
