experiment_name: intel_sycl_trace_1
entrypoint: Experiments.micropatterns.nca_runtime_check:run
output_subdir: generated/intel_sycl_trace_1
seed_mode: fixed
grid:
  # model.family: [NCA, NCA_sycl]
  model.family: [NCA_sycl]
  model.channels: [32]
  run.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [intel_sycl_trace_1]
  run.iterations: [100]
  loss.primary: [[l2_grouped],[vgg_grouped]]
  loss.layers: [[decoded]]
  loss.vgg_internal: [l2]
  trainer.loop_autodiff: [checkpointed]
  trainer.sharding: [2]
  trainer.sycl_fused_steps: [2]
  trainer.jax_trace: [false]
  data.downsample: [4]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regulariser_coeffs.boundary: [0.0]
  loss.regulariser_coeffs.latent_channel_match: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0]
  loss.regulariser_coeffs.latent_size: [0.0]
  loss.regulariser_coeffs.intermediate_state: [0.0]
  loss.random_crop: [False]
  model.upscale_factor: [1]
  run.t: [64]
  model.upsampler.radius: [null]
  model.upsampler.depth: [null]
  model.upsampler.width_factor: [null]
  system.precision: [bfloat16]
  system.gpu: [intel]
  optimiser.type: [nadam]

  system.xla_flags: [null]
  seed: [5678]
