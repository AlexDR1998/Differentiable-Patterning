experiment_name: nca_micropattern_nodal_ko_sweep
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_micropattern_nodal_ko_sweep
seed_mode: index
grid:
  model.family: [NCA]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [NCA_9ch_micropattern_nodal_ko_sweep]
  run.iterations: [8000]
  # loss.terms: [[vgg_grouped,l2_grouped],[ott_grouped,l2_grouped]]
  # loss.terms: [[vgg_grouped,l2_grouped],[ott_grouped,l2_grouped]]
  # loss.terms: [[vgg_grouped,l2_grouped]]
  # loss.terms: [[vgg,l2]]
  loss.terms: [[vgg_grouped,l2_grouped]]
  loss.terms.0.metric: [l2]
  trainer.loop_autodiff: [checkpointed]
  data.downsample: [4]
  data.micropattern.data_channels: [12]
  data.micropattern.duplicate_final_timestep: [true]
  # data.batches: [4]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]
  loss.regularisers.intermediate_state: [1.0]
  loss.terms.0.random_crop: [True]
  loss.terms.0.random_channel_shuffle: [True]
  model.channels: [64]
  trainer.pool_admission_previous_relative_threshold: [1.10]
  optimiser.learn_rate: [5e-4]
  optimiser.decay_rate: [0.98]
  optimiser.type: [nadam,]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [16]
  trainer.log_every: [100]
groups:
  - data.batches: [4]
    run.t: [128]

