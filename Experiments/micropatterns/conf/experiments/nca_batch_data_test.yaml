experiment_name: nca_multibatch_micropattern_sweep_wide_1b
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_multibatch_micropattern_sweep_wide_1b
seed_mode: index
grid:
  model.family: [NCA]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [nca_multibatch_micropattern_sweep_wide_1]
  run.iterations: [8000]
  run.repeat: [0,]
  # loss.terms: [[vgg_grouped,l2_grouped],[ott_grouped,l2_grouped]]
  # loss.terms: [[vgg_grouped,l2_grouped],[ott_grouped,l2_grouped]]
  # loss.terms: [[vgg_grouped,l2_grouped]]
  # loss.terms: [[vgg,l2]]
  loss.terms: [multi_target]
  loss.terms.0.multi_target_weights.texture: [1.0]
  loss.terms.0.multi_target_weights.channel_mean: [0.1,0.0]
  loss.terms.0.multi_target_weights.correlation: [0.1,0.0]
  loss.terms.0.multi_target_weights.radial: [1.0,0.0]
  loss.terms.0.assignment: [hard]
  trainer.loop_autodiff: [lax]
  data.downsample: [8]
  data.micropattern.data_channels: [14]
  data.batches: [2]
  data.dataset: [micropatterns_260726]
  data.micropattern.duplicate_final_timestep: [false]
  # data.batches: [4]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]
  loss.regularisers.intermediate_state: [10.0]
  loss.regularisers.boundary: [10.0]
  # loss.regularisers.radial_profile: [0.0]
  # loss.regularisers.channel_correlation: [1.0]
  model.fire_rate: [0.5]
  loss.terms.0.random_crop: [False]
  loss.terms.0.random_channel_shuffle: [False]
  model.channels: [64]

  trainer.pool_admission_previous_relative_threshold: [1.0,1.05,1.1]
  optimiser.learn_rate: [1e-3]
  optimiser.decay_rate: [0.1]
  optimiser.schedule.type: [cosine]
  optimiser.schedule.final_factor: [0.5,0.1]
  optimiser.schedule.transition_fraction: [0.75]
  optimiser.type: [nadam,muon]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [16]
  trainer.log_every: [200]
  run.t: [128]
  # system.xla_flags: [[command_buffer]]
  system.precision: [bfloat16]
# groups:

