experiment_name: nca_loss_cache_spike_debug
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_loss_cache_spike_debug
seed_mode: index
grid:
  run.mode: [benchmark]
  model.family: [NCA]
  model.channels: [32]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [nca_loss_cache_spike_pool_gate_2]
  run.iterations: [400]
  loss.terms: [[l2_grouped]]
  trainer.loop_autodiff: [lax]
  # trainer.loop_autodiff: [lax]
  data.downsample: [4]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]
  loss.regularisers.intermediate_state: [0.0]
  run.t: [64]
  system.precision: [tensorfloat32]
  trainer.pool_admission_enabled: [true,false]
  trainer.pool_admission_relative_threshold: [null]
  trainer.pool_admission_previous_relative_threshold: [null]
  trainer.pool_admission_absolute_threshold: [null]
  trainer.pool_admission_ema_decay: [0.95]
  trainer.pool_admission_warmup: [null]
  # optimiser.type: [muon]
  trainer.log_every: [10]
  optimiser.type: [nadam,muon]
  labels.gpu: [H100]
  seed: [1234]
  # system.xla_flags: ["--xla_gpu_enable_latency_hiding_scheduler=true", "--xla_gpu_enable_latency_hiding_scheduler=true --xla_gpu_triton_gemm_any=True", "--xla_gpu_triton_gemm_any=True", "--xla_gpu_enable_command_buffer=FUSION"]
  # system.xla_flags: [[triton_gemm],[latency_hiding_scheduler],[command_buffer],[triton_gemm,latency_hiding_scheduler],null]
  system.xla_flags: [null]
  # system.xla_flags: [null]
  # system.xla_flags: ["--xla_gpu_enable_latency_hiding_scheduler=true"]
# groups:
    # run.t : [16,32,64,128]
branches:
  - when:
      trainer.pool_admission_enabled: true
    grid:
      trainer.pool_admission_relative_threshold: [1.1]
      trainer.pool_admission_previous_relative_threshold: [1.0,1.1,1.2,1.3,1.4,1.5]
      trainer.pool_admission_absolute_threshold: [null]
      trainer.pool_admission_ema_decay: [0.95]
      trainer.pool_admission_warmup: [null]

