experiment_name: nca_4ch_micropattern_ott_long_sweep_1
entrypoint: Experiments.micropatterns.uNCA_scaling_loss_hyperparameter_sweep:run
output_subdir: generated/nca_4ch_micropattern_ott_long_sweep_1
seed_mode: index
grid:
  model.family: [NCA]
  run.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [NCA_4ch_micropattern_ott_long_sweep_1]
  run.iterations: [8000]
  run.t: [128]
  trainer.loop_autodiff: [checkpointed]
  trainer.pool_admission_previous_relative_threshold: [1.10] # Unsure of this one
  trainer.log_every: [200]
  trainer.clear_cache_every: [null]
  data.batches: [4]
  data.downsample: [4]
  data.data_channels: [4]
  data.duplicate_final_timestep: [true]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.primary: [[ott_chstack, l2]]
  loss.random_crop: [false]
  loss.random_channel_shuffle: [false]
  loss.regulariser_coeffs.latent_channel_match: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0]
  loss.regulariser_coeffs.latent_size: [0.0]
  loss.regulariser_coeffs.intermediate_state: [1.0]
  model.upscale_factor: [null]
  model.channels: [64]
  optimiser.learn_rate: [5e-4]
  optimiser.decay_rate: [0.98]
  optimiser.type: [nadam]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [16]
  loss.args.S: [16,64,256,512]
  loss.args.K: [2,3,5,7]
  loss.args.D: [1,2,3,4]
  loss.args.epsilon: [0.1]
  loss.args.sharpen: [true]
