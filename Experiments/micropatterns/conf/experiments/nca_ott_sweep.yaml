experiment_name: nca_4ch_micropattern_ott_long_sweep_1
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_4ch_micropattern_ott_long_sweep_1
seed_mode: index
grid:
  model.family: [NCA]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [NCA_4ch_micropattern_ott_long_sweep_1]
  run.iterations: [8000]
  run.t: [128]
  trainer.loop_autodiff: [checkpointed]
  trainer.pool_admission_previous_relative_threshold: [1.10] # Unsure of this one
  trainer.log_every: [200]
  data.batches: [4]
  data.downsample: [4]
  data.micropattern.data_channels: [4]
  data.micropattern.duplicate_final_timestep: [true]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.terms: [[ott_chstack, l2]]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]
  loss.regularisers.intermediate_state: [1.0]
  model.channels: [64]
  optimiser.learn_rate: [5e-4]
  optimiser.decay_rate: [0.98]
  optimiser.type: [nadam]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [16]
  loss.terms.0.S: [16,64,256,512]
  loss.terms.0.K: [2,3,5,7]
  loss.terms.0.D: [1,2,3,4]
  loss.terms.0.epsilon: [0.1]
  loss.terms.0.sharpen: [true]
