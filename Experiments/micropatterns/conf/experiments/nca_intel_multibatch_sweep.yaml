experiment_name: intel_multibatch_sweep_1
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/intel_multibatch_sweep_1
seed_mode: fixed
grid:
  run.mode: [benchmark]
  # model.family: [NCA, NCA_sycl]
  model.family: [NCA_sycl]
  model.channels: [32]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [intel_multibatch_sweep_large_1]
  run.iterations: [8000]
  run.repeat: [0,]

  loss.primary: [multi_target]
  loss.args.multi_target_weights.texture: [1.0]
  loss.args.multi_target_weights.channel_mean: [1.0]
  loss.args.multi_target_weights.correlation: [1.0]
  loss.args.multi_target_weights.radial: [1.0]
  loss.args.assignment: [hard]
  loss.layers: [[decoded]]
  loss.vgg_internal: [l2]
  loss.random_crop: [False]

  trainer.loop_autodiff: [checkpointed]
  trainer.sharding: [2]
  trainer.sycl_fused_steps: [4]
  trainer.sycl_synchronize_custom_calls: [true]
  trainer.jax_trace: [false]

  data.downsample: [8]
  data.micropattern.data_channels: [14]
  data.batches: [2]
  data.dataset: [micropatterns_260726]
  data.micropattern.duplicate_final_timestep: [false]

  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]

  loss.regulariser_coeffs.boundary: [5.0]
  loss.regulariser_coeffs.latent_channel_match: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0]
  loss.regulariser_coeffs.latent_size: [0.0]
  loss.regulariser_coeffs.intermediate_state: [1.0]
  model.upscale_factor: [1]
  run.t: [64]
  model.upsampler.radius: [null]
  model.upsampler.depth: [null]
  model.upsampler.width_factor: [null]
  system.precision: [bfloat16]
  labels.gpu: [intel]
  optimiser.type: [nadam]

  system.xla_flags: [null]
  seed: [5678]
