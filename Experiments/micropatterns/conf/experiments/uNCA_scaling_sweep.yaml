experiment_name: nca_9ch_micropattern_scaling_sweep_2
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_9ch_micropattern_scaling_sweep_2_h100
seed_mode: index
grid:
  model.family: [NCA, uNCA, isouNCA]
  labels.scaling: [diffusive, convective]
  # labels.scaling: [diffusive]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [nca_9ch_micropattern_scaling_sweep_2]
  run.iterations: [4000]
  loss.primary: [[vgg_grouped_and_l2],[ott_grouped_and_l2],[vgg_grouped],[ott_grouped]]
  trainer.loop_autodiff: [checkpointed]
  data.downsample: [1]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regulariser_coeffs.latent_channel_match: [1.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0, 1.0]
  model.upsampler.depth: [4]
  model.upsampler.width_factor: [2]
  model.upsampler.radius: [2]
  model.upsampler.fourier_modes: [5]
branches:
  - when:
      labels.scaling: convective
    groups:
      - model.upscale_factor: [32,16,8,4,2]
        run.t : [8,16,32,64,128]
  - when:
      labels.scaling: diffusive
    groups:
      # - model.upscale_factor: [4,2]
      #   run.t: [512,2048]
      - model.upscale_factor: [32,16,8]
        run.t: [8,32,128]
