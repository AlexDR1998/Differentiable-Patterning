experiment_name: nca_intel_onemkl_runtime_benchmark_2
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_intel_onemkl_runtime_benchmark
seed_mode: fixed

# Compare stable execution policies at equal global batch size. Runtime metrics
# exclude compilation and are emitted by the trainer under runtime/*.
grid:
  run.mode: [benchmark]
  labels.scaling: [convective]
  run.iterations: [200]
  run.warmup: [20]
  run.write_images: [false]
  run.t: [64]
  run.repeat: [0, 1, 2, 3, 4]

  model.family: [NCA_sycl]
  trainer.backend.type: [sycl]
  model.channels: [32]

  data.dataset: [micropatterns_260726]
  data.micropattern.data_channels: [14]
  data.batches: [2]
  data.downsample: [8]
  data.micropattern.duplicate_final_timestep: [false]

  trainer.loop_autodiff: [checkpointed]
  trainer.backend.fused_steps: [4]
  trainer.backend.synchronize_custom_calls: [false]
  trainer.backend.strict_stage_synchronization: [false]
  trainer.backend.serialize_custom_calls: [false]
  trainer.backend.pmean_loss: [true]
  trainer.backend.pmean_regularisers: [true]
  trainer.pool_admission_enabled: [false]
  trainer.log_every: [20]

  loss.terms: [multi_target]
  loss.terms.0.random_crop: [false]
  loss.terms.0.assignment: [hard]
  loss.terms.0.multi_target_weights.texture: [1.0, 0.0]
  loss.terms.0.multi_target_weights.channel_mean: [1.0]
  loss.terms.0.multi_target_weights.correlation: [1.0]
  loss.terms.0.multi_target_weights.radial: [1.0]
  loss.regularisers.intermediate_state: [1.0]
  loss.regularisers.boundary: [5.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.hidden_state_size: [0.0]

  optimiser.type: [nadam]
  optimiser.warmup_steps: [20]
  labels.gpu: [intel]
  system.precision: [highest, bfloat16]
  system.xla_flags: [null]
  logging.wandb.project: [nca_intel_debug]
  # logging.wandb.group: [nca_intel_onemkl_runtime_benchmark]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  seed: [5678]

# Zip the three execution policies rather than taking their Cartesian product.
groups:
  - trainer.sharding: [null, 2, 2]
    trainer.backend.serialize_onemkl: [false, true, false]
    trainer.backend.serialize_backward_custom_calls: [false, false, true]
