experiment_name: isouNCA_9ch_micropattern_debug_sweep_4
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/isouNCA_9ch_micropattern_debug_sweep_4
seed_mode: index
grid:
  model.family: [isouNCA]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [isouNCA_9ch_micropattern_debug_sweep_4]
  run.iterations: [2000]
  loss.primary: [[vgg_grouped_and_l2]]
  loss.vgg_internal: [l2,otsp]
  trainer.loop_autodiff: [checkpointed]
  data.downsample: [1]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regulariser_coeffs.latent_channel_match: [0.0, 1.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0]
  loss.random_crop: [True]
  model.upscale_factor: [8,4]
  run.t: [64,128]
  model.upsampler.radius: [1,2,4]
  model.upsampler.depth: [2,4]
  model.upsampler.width_factor: [null]
