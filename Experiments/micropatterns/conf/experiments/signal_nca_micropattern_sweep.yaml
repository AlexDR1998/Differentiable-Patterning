# NCAs with grown signalling structures (sNCA, gsNCA): signal channels that
# move up to signal_substeps cells per NCA step along wires the NCA grows.
# "cable" diffuses along conductive cells, "axon" carries signals along a
# learned direction. wire_cost penalises the mean conductance.
# Baselines: plain NCA / HNCA runs with the same data and loss settings.
experiment_name: signal_nca_micropattern_sweep_v1
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/signal_nca_micropattern_sweep
seed_mode: index

grid:
  labels.gpu: [H100]
  labels.scaling: [convective]
  system.precision: [highest]

  model.family: [sNCA]
  model.channels: [32]
  model.kernel_str: [[ID, GRAD, LAP]]
  model.fire_rate: [0.5]
  model.signal_mode: [cable, axon]
  model.signal_channels: [4]
  model.signal_substeps: [1, 4, 16]

  run.iterations: [12000]
  run.repeat: [0]
  run.t: [128]

  trainer.loop_autodiff: [checkpointed]
  trainer.pool_admission.previous_relative_threshold: [1.0]
  trainer.log_every: [200]

  logging.wandb.project: [signal_nca_micropatterns]

  loss.terms: [multi_target]
  loss.terms.0.multi_target_weights.l2: [1.0]
  loss.terms.0.multi_target_weights.texture: [1.0]
  loss.terms.0.multi_target_weights.channel_mean: [0.0]
  loss.terms.0.multi_target_weights.correlation: [0.0]
  loss.terms.0.multi_target_weights.radial: [0.1]
  loss.terms.0.assignment: [hard]
  loss.terms.0.random_crop: [false]
  loss.terms.0.random_channel_shuffle: [true]

  loss.regularisers.intermediate_state: [10.0]
  loss.regularisers.boundary: [10.0]
  loss.regularisers.wire_cost: [0.0, 0.01]

  data.micropattern.task: [micropattern_single_replicate]
  data.batches: [1]
  data.downsample: [16]
  data.micropattern.pool_copies: [4]
  data.micropattern.intermediate_reinjection_probability: [1.0]
  data.micropattern.intermediate_reinjection_probability_end: [0.0]
  data.micropattern.intermediate_reinjection_decay_start_fraction: [0.01]
  data.dataset: [micropatterns_260726]
  data.micropattern.duplicate_final_timestep: [false]
  # Observed channels + signal (4) + structure (up to 3) must fit in model.channels
  data.micropattern.data_channels: [4]
  data.micropattern.experiment_groups: [[cell_fate_s1]]

  data.knockout.mode: [null]
  data.knockout.time: [null]
  data.knockout.channel: [Nodal]

  optimiser.type: [nadam]
  optimiser.learn_rate: [1e-3]
  optimiser.decay_rate: [0.1]
  optimiser.schedule.type: [cosine]
  optimiser.schedule.final_factor: [0.5]
  optimiser.schedule.transition_fraction: [0.75]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [16]
