experiment_name: nca_9ch_micropattern_upscale_loss_sweep_3
entrypoint: Experiments.micropatterns.train:run
output_subdir: generated/nca_9ch_micropattern_upscale_loss_grouped_sweep_3
seed_mode: index
grid:
  model.family: [uNCA, isouNCA]
  labels.scaling: [convective]
  logging.wandb.project: [nca_micropattern_upscale]
  logging.wandb.group: [nca_9ch_micropattern_upscale_loss_sweep_3]
  run.iterations: [2000]
  loss.primary: [[vgg_grouped_and_l2]]
  loss.vgg_internal: [l2,otch,otsp]
  trainer.loop_autodiff: [checkpointed]
  data.downsample: [1]
  knockout.mode: [null]
  knockout.time: [null]
  knockout.channel: [Nodal]
  loss.regulariser_coeffs.latent_channel_match: [0.0, 1.0, 10.0]
  loss.regulariser_coeffs.contiguous_growth: [0.0]
groups:
  - model.upscale_factor: [16,8,4,2]
    run.t : [16,32,64,128]
branches:
  - when:
      model.family: uNCA
    grid:
      model.upsampler.fourier_modes: [1,2,4]
      model.upsampler.depth: [2]
      model.upsampler.width_factor: [4]

  - when:
      model.family: isouNCA
    grid:
      model.upsampler.radius: [1,2,4]
      model.upsampler.depth: [2]
      model.upsampler.width_factor: [4]
  - when:
      model.family: NCA
    grid:
      model.upscale_factor: [1]
      run.t: [128]
      loss.regulariser_coeffs.latent_channel_match: [0.0]
      model.upsampler.depth: [null]
      model.upsampler.width_factor: [null]

