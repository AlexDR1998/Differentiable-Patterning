      channels: 32
      kernel_str:
      - ID
      - LAP
      - GRAD
      activation: relu
      fire_rate: 0.5
      padding: REPLICATE
      kernel_scale: 1
      parameter_noise_level: 0.01
    trainer:
      boundary_mode: soft
      grad_loss: true
      log_directory: logs/
      loss_time_channel_mask: null
      loop_autodiff: checkpointed
      log_every: 100
      pool_admission:
        enabled: false
        relative_threshold: 1.25
        previous_relative_threshold: 1.1
        absolute_threshold: null
        ema_decay: 0.95
        warmup_fraction: null
    optimiser:
      type: nadam
      blocknorm: true
      sam: false
      gradient_clip_norm: 1.0
      apply_if_finite: true
      max_consecutive_errors: 8
      learn_rate: 0.001
      warmup_fraction: 0.008
      decay_rate: 0.99
      schedule:
        type: exponential
        warmup_init_lr: 1.0e-06
        final_factor: 0.1
        transition_fraction: 0.75
    loss:
      terms:
      - l2
      regularisers:
        intermediate_state: 1.0
        boundary: 0.0
        contiguous_growth: 0.0
        localised_hidden: 0.0
        update_sensitivity: 0.0
        perturbation_conservation: 0.0
        hidden_state_size: 0.0
        firing_energy: 0.04
        wire_cost: 0.0
    run:
      mode: train
      t: 12
      iterations: 6000
      checkpoint_warmup_fraction: 0.01
      write_images: true
      write_videos: true
      repeat: 0
    logging:
      backend: wandb
      wandb:
        project: nca-signalling-tasks
        group: signalling_task_adaptive_v1
        tags: null
        tag_keys:
        - model.family
        - data.signal_task.task
        - data.signal_task.params
        - run.t
        - loss.regularisers.firing_energy
    model_store:
      enabled: true
      root: models
      collection: nca-signalling-tasks
      model_factory: NCA.model.factory:build_model
emit_files: false
