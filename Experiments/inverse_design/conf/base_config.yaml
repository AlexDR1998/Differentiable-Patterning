schema_version: 10
seed: 0

experiment:
  name: nca_inverse_design_template

system:
  precision: highest
  gpu: null
  xla_flags: null

checkpoint:
  # Registry ID or alias of a trained micropatterns_260726 model. The model,
  # its boundary mode, run.t and the data its 0 h textures come from are all
  # taken from its bundle.
  model_id: REPLACE_WITH_MODEL_ID
  # null: MODEL_STORE_ROOT, then ./models
  store_root: null

logging:
  backend: wandb
  wandb:
    project: NCA-inverse-design
    group: base-config
    tags: null
    tag_keys: null

inverse_design:
  # Relative to the repository root. Its projection must match the model's
  # data.micropattern.projection.
  cell_types_file: Experiments/micropatterns/conf/cell_types/260726_cell_types_sliced_nca.yaml
  iterations: 2000
  batch_size: 4
  log_every: 25
  evaluation_seeds: 16
  # Rollouts of the best geometry shown in the final W&B video (0: no video)
  video_seeds: 2
  # Same-area ellipses scored before optimising (harmonic-2 amplitudes, each
  # at 0 and 45 degrees); the circle is always scored
  baseline_ellipses: [0.15, 0.3]

  geometry:
    harmonics: 3
    coefficient_limit: 0.3
    # 0 starts from the circle
    initial_scale: 0.05
    fixed_radius: true
    radius_scale: 1.0
    grid_scale: 1.5
    # Sweep over this to restart from other initial shapes
    repeat: 0
    # false keeps the initial shape (a density-only control)
    optimise: true

  objective:
    target: Notochord
    temperature: 0.03
    # false minimises the target share (a control)
    maximise: true
    amount_weight: 0.0

  penalties:
    perimeter_weight: 0.0
    coefficient_weight: 0.0
    border_weight: 1.0

  mask_softness:
    start: 0.08
    end: 0.02

  optimiser:
    learn_rate: 0.01
    gradient_clip_norm: 1.0

  rollout:
    hours: 48
    scan_kind: checkpointed
    checkpoints: null

  texture:
    bank_size: 16
    # Settings for each projection, tuned in boundary_mask_explorer.py. When
    # set, all texture settings but bank_size come from this file, for the
    # model's projection; null uses the values below.
    file: Experiments/micropatterns/conf/textures/260726_texture_settings.yaml
    mode: patch
    patch_size: 11
    patch_overlap: 7
    patch_jitter: 3
    # Pixels at this downsample, rescaled to the model's; null: the model's pixels
    patch_downsample: null
    interior_fraction: 0.8
    candidates: 24
    iaaft_iterations: 25
    normalise: false
    normalise_iterations: 4

  # Cell density: the share of the colony covered by cells. Cells keep their
  # brightness; the gaps between them grow or shrink.
  density:
    # none: textures keep the reference colonies' own gaps; fixed: gaps for
    # the density `initial`; optimise: learn the density with the shape
    mode: none
    # null: the mean covered fraction of the training colonies
    initial: null
    # Generic cell markers that tell cells from gaps
    markers: [LMBR, SOX2]
    # Sharpness of the cell/gap edge (standard deviations of the random field)
    edge_width: 0.1
    # Circles also scored at these multiples of the starting density
    baselines: [0.5, 0.75, 1.25]
