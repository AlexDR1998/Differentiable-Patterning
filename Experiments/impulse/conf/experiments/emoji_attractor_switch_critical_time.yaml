# Is there a critical stage of development after which an attractor can no
# longer be switched? The impulse acts on the source pattern after
# impulse_time of growth (0: the seed), and is scored against the mature
# source and target, grown for stabilisation_steps. Times are multiples of
# each model's run.t, so one grid covers models trained for different times.
#
# Two impulse settings for each time: a global hidden impulse with no size
# penalty (the upper bound: where switching becomes impossible even without
# a size limit), and a small local hidden impulse (gating v3 settings).
#
# Fill the REPLACE_* slots with 2-attractor bundles trained with different
# run.t (e.g. 32, 64, 128, 256; NCA and gNCA). Each ID appears twice: once in
# the grid and once in its branch. Placeholders must stay distinct until
# replaced. Copy a slot and its branch for more models.
experiment_name: emoji_attractor_switch_critical_time_v1
entrypoint: Experiments.impulse.optimise:run
output_subdir: generated/emoji_attractor_switch_critical_time
seed_mode: index

transitions:
  k2: &k2
    impulse.pair_source.source_index: [0, 1]
    impulse.pair_source.target_index: [1, 0]

grid:
  checkpoint.model_id:
    - 20261012T170018Z-cfg870b44681de6-b96926b9  # rooster alien
  impulse.iterations: [2000]
  impulse.batch_size: [8]
  impulse.pair_source.type: [stable_attractor]
  impulse.pair_source.time_unit: [training_t]
  impulse.pair_source.impulse_time: [0, 0.125, 0.25, 0.5, 0.75, 1.0, 1.5]
  # Mature source and target: 1.5-2 run.t, within the training horizon
  # (target_repeats: 2 trains the target to persist up to 2 run.t)
  impulse.pair_source.stabilisation_steps: [[1.5, 2.0]]
  impulse.objective.type: [attractor_contrast]
  impulse.objective.contrast_weight: [0.1]
  impulse.rollout.steps: [256]
  impulse.rollout.loss_window: [64]
  impulse.rollout.evaluation_steps: [1024]
  impulse.rollout.evaluation_frame_every: [32]
  impulse.optimiser.learn_rate: [0.01]
  impulse.intervention.channels: [all]
  impulse.repeat: [0]
  impulse.intervention.spatial: [patch]
  impulse.intervention.patch_size: [1, 3, 5, 9]
  

# One branch per model: its transitions and W&B tags for filtering
branches:
  - when: {checkpoint.model_id: 20261012T170018Z-cfg870b44681de6-b96926b9}
    grid: {logging.wandb.tags: [[attractors:2,]]}
    groups: [*k2]
  
