# Pipeline smoke test: optimise an impulse on an existing trained emoji model
# for a few iterations. A run passes when it exits cleanly (it publishes no
# bundle).
#
# Set checkpoint.model_id to a multi_attractor emoji bundle that exists in the
# model store both locally and on the cluster, e.g. one from smoke_emoji.
# Until the placeholder is replaced, pipeline_smoke_test.py skips this sweep.
experiment_name: smoke_impulse
entrypoint: Experiments.impulse.optimise:run
output_subdir: generated/smoke_impulse
seed_mode: fixed

grid:
  checkpoint.model_id: [20261009T112029Z-cfg40e6697d57a1-b0638e96]
  logging.wandb.project: [pipeline-smoke]
  impulse.iterations: [4]
  impulse.batch_size: [2]
  impulse.resample_every: [2]
  impulse.log_every: [1]
  impulse.pair_source.stabilisation_steps: [[8, 16]]
  impulse.rollout.steps: [8]
  impulse.rollout.evaluation_steps: [16]

groups:
  # The third run covers restarts, random initial values, the rollout
  # curriculum and the attractor contrast objective; the fourth and fifth a
  # sparse grid and two patches; the last an impulse during development
  - impulse.objective.type: [targeted, minimal_destructive, attractor_contrast, targeted, targeted, targeted]
    impulse.rollout.loss_window: [1, 4, 2, 1, 1, 1]
    impulse.intervention.spatial: [local, patch, patch, sparse, patch, local]
    impulse.intervention.duration: [1, 2, 1, 1, 1, 1]
    impulse.intervention.restarts: [1, 1, 2, 1, 1, 1]
    impulse.intervention.init_scale: [0.0, 0.0, 0.05, 0.0, 0.05, 0.0]
    impulse.intervention.stride: [1, 1, 1, 4, 1, 1]
    impulse.intervention.patches: [1, 1, 1, 1, 2, 1]
    impulse.rollout.curriculum: [false, false, true, false, false, false]
    impulse.pair_source.impulse_time: [null, null, null, null, null, 4]
