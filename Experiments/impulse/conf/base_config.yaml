schema_version: 7
seed: 0

experiment:
  name: nca_impulse_template

system:
  # The precision the emoji models were trained with
  precision: tensorfloat32
  gpu: null
  xla_flags: null

checkpoint:
  # Registry ID or alias of the trained model to perturb. The model
  # architecture comes from its bundle.
  model_id: REPLACE_WITH_MODEL_ID
  # null: MODEL_STORE_ROOT, then ./models
  store_root: null

logging:
  backend: wandb
  wandb:
    project: NCA-impulse
    group: base-config
    tags: null
    tag_keys: null

# null: use the data section the model was trained with. Set a full data
# section here to start from different initial conditions.
data: null

impulse:
  iterations: 1000
  batch_size: 8
  resample_every: 100
  log_every: 100
  # Sweep over this to repeat a config with different seeds
  repeat: 0

  pair_source:
    # stable_attractor: grown source pattern -> grown target pattern
    # external_target: source initial condition -> target data image
    # model_future: source initial condition -> its own unperturbed future
    # trajectory_state: two time points of the source data trajectory
    type: stable_attractor
    # Indices into data.emoji.pairs
    source_index: 0
    target_index: 1
    stabilisation_steps: [128, 256]
    target_steps: 192
    initial_time: 0
    target_time: -1

  rollout:
    steps: 64
    # Average the target loss over the last loss_window steps (1: final state only)
    loss_window: 1
    evaluation_steps: 256
    # Saved evaluation trajectories keep RGBA of every n-th state only
    evaluation_frame_every: 8
    scan_kind: lax
    # checkpointed only: saved states (null: equinox chooses; steps: every
    # state, so each step is rerun once in the backward pass)
    checkpoints: null

  intervention:
    # all, observed (or obs), hidden, or single (the first hidden channel)
    channels: hidden
    # local (Gaussian of std width, learned centre), patch (square of
    # patch_size pixels, learned centre and values), global or flat
    spatial: local
    width: 0.2
    patch_size: 3
    # NCA steps the impulse is applied for (a k x k x duration cuboid for patch)
    duration: 1
    # Label for grouping runs in W&B only (not used by the run)
    budget: null

  objective:
    type: targeted
    target_weight: 1.0
    tolerance: 0.01
    constraint_weight: 100.0
    magnitude: l2
    reward_weight: 1.0

  loss:
    terms:
      - type: l2
        weight: 1.0
        channels: observed
    regularisers:
      l1: 0.0
      l2: 1.0
      linf: 0.0
      smoothness: 0.0
      state_range: 0.0

  optimiser:
    type: adam
    learn_rate: 0.001
    gradient_clip_norm: 1.0

  output:
    directory: impulse_runs
    base_env: IMPULSE_OUTPUT_PATH
