experiment_name: multi_attractor_stability_sweep_v1

entrypoint: Experiments.emoji.train:run

output_subdir: generated/emoji_multi_attractor_outsource

seed_mode: index

grid:

  run.repeat: [0]

  data.emoji.task: [multi_attractor]

  data.emoji.target_repeats: [2]

  logging.wandb.project: [NCA-emoji-multi-attractor]

  model.family: [gNCA]
  # logging.wandb.tags: [[gNCA]]

  model.channels: [64]

  model.padding: [REPLICATE]

  run.t: [128]

  run.iterations: [16000]
  data.batches: [2]
  data.emoji.shift_amount: [10]
  data.emoji.pad: [[10,10,10,10]]
  data.emoji.terminal_carry.start_fraction: [0.5]
  data.emoji.terminal_carry.end_fraction: [0.75]
  data.emoji.terminal_carry.initial_probability: [0.1]
  data.emoji.terminal_carry.final_probability: [0.9]
  data.emoji.regeneration.start_fraction: [0.5]
  data.emoji.regeneration.end_fraction: [0.75]
  data.emoji.regeneration.initial_probability: [0.05]
  data.emoji.regeneration.final_probability: [0.25]
  loss.terms: [[l2]]
  loss.regularisers.intermediate_state: [1.0]
  loss.regularisers.contiguous_growth: [1.0]
  loss.regularisers.localised_hidden: [1.0]

# Each attractor set is paired with its batch duplication (2 for 2-3
# attractors, 1 for 4-5, to keep the batch size down) and an attractors:N
# W&B tag for filtering runs by number of attractors.
groups:
  - experiment.stability_mode: [clean, terminal_carry, regeneration, terminal_carry_and_regeneration]
    data.emoji.terminal_carry.enabled: [false, true, false, true]
    data.emoji.regeneration.enabled: [false, false, true, true]

  - data.emoji.pairs:

      # ==========================================
      # 2
      # ==========================================

      # 2.1: crab + microbe
      - - initial: {image: crab.png, mode: patch, size: 1}
          target: crab.png

        - initial: {image: microbe.png, mode: patch, size: 1}
          target: microbe.png

      # 2.2: crab + rooster
