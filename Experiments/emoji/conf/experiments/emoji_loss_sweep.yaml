experiment_name: emoji_loss_sweep
entrypoint: Experiments.emoji.train:run
output_subdir: generated/emoji_loss_sweep
seed_mode: index
grid:
  logging.wandb.project: [nca-emojis-thesis-ch1]
  logging.wandb.group: [emoji-loss-sweep]
  model.family: [NCA]
  model.channels: [32]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.fire_rate: [0.5]
  data.downsample: [1]
  data.emoji.regenerate: [true]
  run.t: [64]
  run.iterations: [8000]
  optimiser.learn_rate: [0.001]
  loss.regularisers.intermediate_state: [0.0]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.perturbation_conservation: [0.0]
  loss.regularisers.update_sensitivity: [0.0]
groups:
  - loss.terms:
      - [{type: l2}]
      - [{type: sliced_wasserstein_channel, samples: 64, epsilon: 0.1}]
      - [{type: ott, S: 128, epsilon: 0.1, metric: l2}]
      - [{type: emd_loss, samples: 64, epsilon: 0.1, normalize: true, tau: 1.0, amplitude_penalty: true, metric: l2}]
