experiment_name: fast_kan_emoji_smoke
entrypoint: Experiments.emoji.train:run
output_subdir: generated/fast_kan_emoji_smoke
seed_mode: fixed
grid:
  model.family: [FastKaNCA]
  model.channels: [12]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.kan.num_basis: [8]
  model.kan.base_activation: [identity]
  model.kan.use_layernorm: [true]
  model.kan.final_zero_init: [true]
  data.batches: [1]
  data.downsample: [2]
  data.emoji.pad: [[10, 10, 10, 10]]
  data.emoji.regenerate: [true]
  run.t: [8]
  run.iterations: [10]
  run.warmup: [2]
  run.write_images: [false]
  trainer.log_every: [5]
  trainer.loop_autodiff: [checkpointed]
  loss.terms: [[l2]]
  loss.regularisers.intermediate_state: [1.0]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.update_sensitivity: [0.0]
  loss.regularisers.perturbation_conservation: [0.0]
  optimiser.learn_rate: [0.001]
  optimiser.decay_rate: [0.99]
  logging.wandb.project: [NCA-emoji]
  logging.wandb.group: [fast-kan-emoji-smoke]
