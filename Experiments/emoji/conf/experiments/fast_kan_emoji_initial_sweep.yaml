experiment_name: fast_kan_emoji_initial_sweep
entrypoint: Experiments.emoji.emoji_training_sweep:run
output_subdir: generated/fast_kan_emoji_initial_sweep
seed_mode: fixed
grid:
  logging.wandb.project: [KAN-NCA]
  logging.wandb.group: [fast-kan-emoji-initial-sweep-2]
  model.family: [FastKaNCA]
  model.channels: [8, 12, 16, 20]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.activation: [relu]
  model.fire_rate: [0.5]
  model.padding: [REPLICATE]
  model.kernel_scale: [1]
  model.kan.hidden_features: [null]
  model.kan.num_basis: [4, 8, 16]
  model.kan.base_activation: [identity]
  model.kan.use_layernorm: [true,false]
  model.kan.trainable_width: [true]
  model.kan.final_zero_init: [true]
  data.downsample: [1]
  data.batches: [2]
  data.pad: [[10, 10, 10, 10]]
  data.regenerate: [true]
  data.shift_amount: [10]
  data.noise_strength: [0.005]
  run.t: [64]
  run.iterations: [1000]
  run.warmup: [10]
  run.write_images: [true]
  run.sparse_pruning: [false]
  trainer.log_every: [50]
  trainer.clear_cache_every: [null]
  trainer.loop_autodiff: [checkpointed]
  loss.primary: [[l2]]
  loss.layers: [[decoded]]
  loss.regulariser_coeffs.intermediate_state: [0.0]
  loss.regulariser_coeffs.boundary: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [1.0]
  loss.regulariser_coeffs.update_sensitivity: [0.0]
  loss.regulariser_coeffs.perturbation_conservation: [0.0]
  optimiser.type: [muon]
  optimiser.learn_rate: [0.0003]
  optimiser.warmup_steps: [64]
  optimiser.decay_rate: [0.99, 0.98]
  optimiser.blocknorm: [true]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [8]
groups:
  - data.sequence:
      - [alien_monster.png, microbe.png, rooster.png, rooster.png]
      # - [crab.png, microbe.png, alien_monster.png, alien_monster.png]
      - [avocado.png, mushroom.png, lizard.png, lizard.png]
