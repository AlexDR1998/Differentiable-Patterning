experiment_name: fast_kan_emoji_long_sweep_1
entrypoint: Experiments.emoji.train:run
output_subdir: generated/fast_kan_emoji_long_sweep_1
seed_mode: index
grid:
  logging.wandb.project: [KAN-NCA]
  logging.wandb.group: [fast-kan-emoji-model-long-sweep-1]
  model.family: [FastKaNCA]
  model.channels: [32]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.activation: [relu]
  model.fire_rate: [0.5]
  model.padding: [REPLICATE]
  model.kernel_scale: [1]
  model.kan.hidden_features: [null]
  model.kan.basis: [linear_spline]
  model.kan.extrapolation: [constant, linear]
  model.kan.num_basis: [12]
  model.kan.base_activation: [null]
  model.kan.spline_init_scale: [0.00001,0.0001,0.001,0.01,0.1]
  # model.kan.spline_init_scale: [0.001, 0.01, 0.1]
  model.kan.base_init_scale: [0.0]
  # model.kan.base_activation: [identity]
  model.kan.use_layernorm: [false]
  model.kan.trainable_width: [true]
  model.kan.final_zero_init: [false]
  data.downsample: [2]
  data.batches: [4]
  data.pad: [[10, 10, 10, 10]]
  data.regenerate: [true]
  data.shift_amount: [10]
  data.noise_strength: [0.005]
  run.t: [64]
  run.iterations: [8000]
  run.warmup: [10]
  run.write_images: [true]
  run.sparse_pruning: [false]
  trainer.log_every: [200]
  trainer.clear_cache_every: [null]
  trainer.loop_autodiff: [checkpointed]
  loss.primary: [[l2]]
  loss.layers: [[decoded]]
  loss.regulariser_coeffs.intermediate_state: [5.0]
  loss.regulariser_coeffs.boundary: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [1.0]
  loss.regulariser_coeffs.update_sensitivity: [0.0]
  loss.regulariser_coeffs.perturbation_conservation: [0.0]
  optimiser.type: [nadam,adamw] # adamw seems best
  optimiser.learn_rate: [5e-4] # 1e-4 seems best
  optimiser.warmup_steps: [64]
  optimiser.decay_rate: [0.99]
  optimiser.blocknorm: [false]
  optimiser.gradient_clip_norm: [1.0]
  optimiser.apply_if_finite: [true]
  optimiser.max_consecutive_errors: [8]
  data.sequence: [[alien_monster.png, microbe.png, rooster.png, rooster.png]]
groups:
  - model.kan.grid_min: [-0.1,-0.5,-1.0,-2.0]
    model.kan.grid_max: [0.1,0.5,1.0,2.0]
      # - [crab.png, microbe.png, alien_monster.png, alien_monster.png]
      # - [avocado.png, mushroom.png, lizard.png, lizard.png]
