experiment_name: nca_emoji_upscale_sweep_1
entrypoint: Experiments.emoji.nca_upscale_sweep:run
output_subdir: generated/nca_upscale_sweep_1
seed_mode: index
grid:
  model.family: [NCA, uNCA, isouNCA]
  logging.wandb.project: [nca_emoji_upscale]
  logging.wandb.group: [nca_emoji_upscale_sweep_1]
  run.iterations: [2000]
branches:
  - when:
      model.family: uNCA
    grid:
      model.upsampler.fourier_modes: [1,2,3]
      loss.regulariser_coeffs.latent_channel_match: [0.0, 1.0]
      model.upsampler.depth: [2,4]
      model.upsampler.width_factor: [1,2]
    groups:
    - model.upscale_factor: [1, 2, 4, 8]
      run.t : [128, 64, 32, 16]
  - when:
      model.family: isouNCA
    grid:
      model.upsampler.radius: [1,2]
      loss.regulariser_coeffs.latent_channel_match: [0.0, 1.0]
      model.upsampler.depth: [2,4]
      model.upsampler.width_factor: [1,2]
      groups:
      - model.upscale_factor: [1, 2, 4, 8]
        run.t: [128, 64, 32, 16]
  - when:
      model.family: NCA
    grid:
      model.upscale_factor: [1]
      run.t: [128]
      loss.regulariser_coeffs.latent_channel_match: [0.0]
      model.upsampler.depth: [null]
      model.upsampler.width_factor: [null]


