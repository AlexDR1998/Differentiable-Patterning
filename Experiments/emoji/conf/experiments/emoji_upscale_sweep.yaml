experiment_name: emoji_upscale_sweep
entrypoint: Experiments.emoji.train:run
output_subdir: generated/emoji_upscale_sweep
seed_mode: index
grid:
  logging.wandb.project: [nca_emoji_upscale]
  logging.wandb.group: [emoji-upscale-sweep]
  model.family: [NCA, uNCA, isouNCA]
  model.channels: [32]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.fire_rate: [0.5]
  data.downsample: [1]
  data.regenerate: [true]
  data.pad: [[20, 20, 20, 20]]
  run.iterations: [2000]
  loss.primary: [[l2]]
  loss.layers: [[decoded]]
  loss.regulariser_coeffs.intermediate_state: [1.0]
  loss.regulariser_coeffs.boundary: [0.0]
  loss.regulariser_coeffs.contiguous_growth: [1.0]
  loss.regulariser_coeffs.perturbation_conservation: [0.0]
  loss.regulariser_coeffs.update_sensitivity: [0.0]
branches:
  - when:
      model.family: uNCA
    grid:
      model.upsampler.fourier_modes: [1, 2, 3]
      model.upsampler.depth: [2, 4]
      model.upsampler.width_factor: [1, 2]
      loss.regulariser_coeffs.latent_channel_match: [0.0, 1.0]
    groups:
      - model.upscale_factor: [1, 2, 4, 8]
        run.t: [128, 64, 32, 16]
  - when:
      model.family: isouNCA
    grid:
      model.upsampler.radius: [1, 2]
      model.upsampler.depth: [2, 4]
      model.upsampler.width_factor: [1, 2]
      loss.regulariser_coeffs.latent_channel_match: [0.0, 1.0]
    groups:
      - model.upscale_factor: [1, 2, 4, 8]
        run.t: [128, 64, 32, 16]
  - when:
      model.family: NCA
    grid:
      model.upscale_factor: [1]
      run.t: [128]
      loss.regulariser_coeffs.latent_channel_match: [0.0]
