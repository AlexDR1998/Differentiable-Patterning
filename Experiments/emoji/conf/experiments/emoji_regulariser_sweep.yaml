experiment_name: emoji_regulariser_sweep
entrypoint: Experiments.emoji.train:run
output_subdir: generated/emoji_regulariser_sweep
seed_mode: index
grid:
  logging.wandb.project: [nca-emojis-thesis-ch1]
  logging.wandb.group: [emoji-regulariser-sweep]
  model.family: [NCA]
  model.channels: [32]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.fire_rate: [0.5]
  data.downsample: [1]
  data.emoji.regenerate: [true]
  run.t: [64]
  run.iterations: [8000]
  loss.terms: [[l2]]
  loss.regularisers.intermediate_state: [0.0, 0.01, 0.1, 1.0]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0, 0.01, 0.1, 1.0]
  loss.regularisers.perturbation_conservation: [0.0, 0.01, 0.1, 1.0]
  loss.regularisers.update_sensitivity: [0.0, 0.01, 0.1, 1.0]
