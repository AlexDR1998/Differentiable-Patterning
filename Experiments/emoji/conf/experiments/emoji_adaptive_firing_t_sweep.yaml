# Is a learned firing rate (aNCA) less sensitive to the rollout length run.t
# than a fixed one (NCA)? The firing energy coefficient is scaled with run.t,
# so the cost of each single cell update is the same for every t
# (here 0.1 at t = 64; set it from the best value in emoji_adaptive_firing_basic).
experiment_name: emoji_adaptive_firing_t_sweep
entrypoint: Experiments.emoji.train:run
output_subdir: generated/emoji_adaptive_firing_t_sweep
seed_mode: index
grid:
  logging.wandb.project: [nca-emoji-adaptive-firing]
  logging.wandb.group: [emoji-adaptive-firing-t-sweep]
  model.family: [NCA, aNCA]
  model.channels: [16]
  model.fire_rate: [0.5]
  data.emoji.task: [multi_attractor]
  data.emoji.pairs:
    - - initial: {image: crab.png, mode: patch, size: 12}
        target: crab.png
  data.emoji.target_repeats: [2]
  data.emoji.regeneration.enabled: [false]
  data.batches: [2]
  run.t: [32, 64, 128, 256]
  run.iterations: [8000]
  run.repeat: [0, 1]
  loss.terms: [[l2]]
branches:
  - when: {model.family: aNCA, run.t: 32}
    grid:
      loss.regularisers.firing_energy: [0.05]
  - when: {model.family: aNCA, run.t: 64}
    grid:
      loss.regularisers.firing_energy: [0.1]
  - when: {model.family: aNCA, run.t: 128}
    grid:
      loss.regularisers.firing_energy: [0.2]
  - when: {model.family: aNCA, run.t: 256}
    grid:
      loss.regularisers.firing_energy: [0.4]
