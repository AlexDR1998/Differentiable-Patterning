experiment_name: emoji_baseline_training_sweep
entrypoint: Experiments.emoji.train:run
output_subdir: generated/emoji_baseline_training_sweep
seed_mode: index
grid:
  logging.wandb.project: [nca-emojis-thesis-ch1]
  logging.wandb.group: [emoji-baseline-training-sweep]
  model.family: [NCA, gNCA]
  model.channels: [16, 32]
  model.kernel_str: [[ID, LAP, GRAD], [ID, LAP, DIFF]]
  model.fire_rate: [0.5]
  data.downsample: [1]
  data.emoji.regenerate: [false, true]
  run.iterations: [8000]
  loss.terms: [[l2]]
  loss.regularisers.intermediate_state: [0.0]
  loss.regularisers.boundary: [0.0]
  loss.regularisers.contiguous_growth: [0.0]
  loss.regularisers.perturbation_conservation: [0.0]
  loss.regularisers.update_sensitivity: [0.0]
branches:
  - when:
      model.channels: 16
    grid:
      run.t: [128]
  - when:
      model.channels: 32
    grid:
      run.t: [64]
