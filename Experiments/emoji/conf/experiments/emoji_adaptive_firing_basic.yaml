# Does an NCA with a learned per-cell firing rate (aNCA) still grow and keep
# the target, and does the firing energy cost make cells go quiet afterwards?
# Baseline: NCA with a fixed firing rate. For aNCA, model.fire_rate is only
# the initial firing probability.
experiment_name: emoji_adaptive_firing_basic
entrypoint: Experiments.emoji.train:run
output_subdir: generated/emoji_adaptive_firing_basic
seed_mode: index
grid:
  logging.wandb.project: [nca-emoji-adaptive-firing]
  logging.wandb.group: [emoji-adaptive-firing-basic]
  model.family: [NCA, aNCA]
  model.channels: [16]
  model.fire_rate: [0.5]
  data.emoji.task: [multi_attractor]
  data.emoji.pairs:
    - - initial: {image: crab.png, mode: patch, size: 6}
        target: crab.png
  data.emoji.target_repeats: [2]
  data.emoji.regeneration.enabled: [false]
  data.batches: [2]
  data.downsample: [2]
  run.t: [256]
  run.iterations: [16000]
  run.repeat: [0,]
  loss.terms: [[l2]]
# firing_energy only exists for models with a learned firing rate
branches:
  - when:
      model.family: aNCA
    grid:
      model.firing_estimator: [straight_through, expected]
      loss.regularisers.firing_energy: [0.0, 0.01, 0.1, 1.0]
