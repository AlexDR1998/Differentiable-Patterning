  config:
    schema_version: 7
    seed: 321236752
    experiment:
      name: stability-and-regeneration-7-long
      stability_mode: clean
    system:
      precision: tensorfloat32
      gpu: null
      xla_flags: null
    data:
      dataset: emojis
      batches: 4
      downsample: 1
      emoji:
        task: multi_attractor
        sequence:
        - alien_monster.png
        - microbe.png
        - rooster.png
        - rooster.png
        pairs:
        - initial:
            image: crab.png
            mode: patch
            size: 1
          target: crab.png
        - initial:
            image: microbe.png
            mode: patch
            size: 1
          target: microbe.png
        target_repeats: 2
        timesteps: null
        observed_channels: 4
        data_channels: 4
        crop_square: false
        pad:
        - 10
        - 10
        - 10
        - 10
        shift_amount: 10
        noise_strength: 0.005
        noise_mode: full
        terminal_carry:
          enabled: false
          start_iteration: 8000
          schedule_iterations: 4000
          initial_probability: 0.1
          final_probability: 0.9
        regeneration:
          enabled: false
          start_iteration: 8000
          schedule_iterations: 4000
          initial_probability: 0.05
          final_probability: 0.25
    model:
      family: NCA
      channels: 48
      kernel_str:
      - ID
      - LAP
      - GRAD
      activation: relu
      fire_rate: 0.5
      padding: REPLICATE
      kernel_scale: 1
      parameter_noise_level: 0.01
    trainer:
      boundary_mode: soft
      grad_loss: true
      log_directory: logs/
      loss_time_channel_mask: null
      loop_autodiff: lax
      log_every: 100
      pool_admission:
        enabled: true
        relative_threshold: 1.25
        previous_relative_threshold: 1.1
        absolute_threshold: null
        ema_decay: 0.95
        warmup: null
    optimiser:
      type: nadam
      blocknorm: true
      sam: false
      gradient_clip_norm: 1.0
      apply_if_finite: true
      max_consecutive_errors: 16
      learn_rate: 0.001
      warmup_steps: 64
      decay_rate: 0.1
      schedule:
        type: cosine
        warmup_init_lr: 1.0e-06
        final_factor: 0.5
        transition_fraction: 0.75
    loss:
      terms:
      - l2
      regularisers:
        intermediate_state: 1.0
        boundary: 0.0
        contiguous_growth: 1.0
        localised_hidden: 1.0
        update_sensitivity: 0.0
        perturbation_conservation: 0.0
        hidden_state_size: 0.0
    run:
      t: 128
      derive_t_from_fire_rate: false
      fire_rate_step_numerator: null
      iterations: 16000
      checkpoint_warmup: 10
      write_images: true
      repeat: 0
    logging:
      backend: wandb
      wandb:
        project: NCA-emoji-multi-attractor
        group: stability-and-regeneration-7-long
        tags: null
        tag_keys:
        - model.family
        - run.repeat
        - model.padding
        - data.emoji.pairs
        - experiment.stability_mode
        - data.emoji.terminal_carry.enabled
        - data.emoji.regeneration.enabled
    model_store:
      enabled: true
      root: models
      collection: NCA-emoji
      model_factory: NCA.model.factory:build_model
