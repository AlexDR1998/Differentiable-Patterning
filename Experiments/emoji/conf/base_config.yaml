seed: 0

experiment:
  name: nca_emoji_template

system:
  precision: tensorfloat32
  gpu: null
  xla_flags: null

data:
  dataset: emojis
  # sequence: one temporal image sequence; multi_attractor: independent
  # initial-condition/target trajectories declared in pairs below.
  task: sequence
  sequence: [alien_monster.png, microbe.png, rooster.png, rooster.png]
  # Multi-attractor pair form:
  # pairs:
  #   - initial: {image: crab.png, mode: patch, size: 12}
  #     target: crab.png
  # `initial` may also be a filename (full image), or use mode: pixel with
  # channel/value. All pairs must resolve to the same C x H x W shape.
  pairs: []
  # For multi_attractor, construct [initial, target, ...target] with this many
  # target states. Repeated targets train persistence as well as formation.
  target_repeats: 2
  # For multi_attractor this is the number of copies made of every pair.
  batches: 4
  timesteps: null
  observed_channels: 4
  data_channels: 4
  downsample: 1
  crop_square: false
  pad: [10, 10, 10, 10]
  shift_amount: 2
  noise_strength: 0.005
  noise_mode: full
  regenerate: true
  # Recycle terminal predictions into the terminal target->target pair. This
  # exposes the model to a geometric distribution of increasingly old states.
  terminal_carry:
    enabled: false
    start_iteration: 1000
    schedule_iterations: 4000
    initial_probability: 0.5
    final_probability: 0.9
  # Scheduled per-batch spatial damage. The default preserves the previous
  # regenerate=true behavior (all batches damaged from the start).
  regeneration:
    enabled: ${data.regenerate}
    start_iteration: 0
    schedule_iterations: 0
    initial_probability: 1.0
    final_probability: 1.0

model:
  family: NCA
  channels: 32
  kernel_str: [ID, LAP, GRAD]
  activation: relu
  fire_rate: 0.5
  padding: REPLICATE
  kernel_scale: 1
  parameter_noise_level: 0.01
  upscale_factor: 1
  upsampler:
    depth: null
    width_factor: null
    fourier_modes: null
    radius: null
  kan:
    hidden_features: null
    num_basis: 8
    grid_min: -2.0
    grid_max: 2.0
    rbf_width: null
    trainable_width: true
    use_base_branch: true
    base_activation: identity
    use_layernorm: true
    spline_init_scale: 0.1
    base_init_scale: 0.1
    final_zero_init: true

trainer:
  boundary_mode: soft
  grad_loss: true
  sharding: null
  model_directory: models/
  log_directory: logs/
  loss_time_channel_mask: null
  loop_autodiff: checkpointed
  clear_cache_every: null
  log_every: 100
  pool_admission_enabled: true
  pool_admission_relative_threshold: 1.25
  pool_admission_previous_relative_threshold: 1.10
  pool_admission_absolute_threshold: null
  pool_admission_ema_decay: 0.95
  pool_admission_warmup: null

optimiser:
  type: nadam
  blocknorm: true
  sam: false
  gradient_clip_norm: null
  apply_if_finite: false
  max_consecutive_errors: 8
  learn_rate: 0.001
  warmup_steps: 64
  decay_rate: 0.99
  schedule:
    type: exponential
    warmup_init_lr: 1e-6
    final_factor: 0.1
    transition_fraction: 0.75

loss:
  primary: [l2]
  layers: [decoded]
  vgg_internal: l2
  random_crop: false
  random_channel_shuffle: false
  regulariser_coeffs:
    intermediate_state: 1.0
    boundary: 0.0
    contiguous_growth: 1.0
    update_sensitivity: 0.0
    perturbation_conservation: 0.0
    latent_channel_match: 0.0
    latent_size: 0.0
  args:
    channels: null
    experiment_groups: null
    S: 1024
    K: 5
    D: 3
    sharpen: true
    epsilon: 0.1
    internal_loss_func: l2
    samples: 128
    normalize: null
    tau: null
    amplitude_penalty: null

run:
  t: 64
  derive_t_from_fire_rate: false
  fire_rate_step_numerator: null
  iterations: 8000
  warmup: 10
  write_images: true
  sparse_pruning: false
  target_sparsity: 0.5
  filename_mode: hydra

logging:
  backend: wandb
  wandb:
    project: NCA-emoji
    group: base-config
    tags: null

knockout:
  time: null
  channel: null
