experiment_name: nca_snowmelt_resolution_sweep_v2
entrypoint: Experiments.snowmelt.train:run
output_subdir: generated/nca_snowmelt_resolution_sweep
seed_mode: index

# Snowmelt sweep over spatial and temporal resolution together, along the
# convective diagonal (t proportional to 1/h). Target NDSI, static DEM plus
# slope and aspect (NORTHNESS, EASTNESS). The slope and aspect channels are
# averaged from the 10 m maps, so coarse grids keep sub-pixel terrain that the
# gradient of the downsampled DEM loses.
# Target/static channels are swept in nca_snowmelt_input_sweep.yaml and model
# hyperparameters in nca_snowmelt_architecture_sweep.yaml and
# nca_snowmelt_update_rule_sweep.yaml.
#
# Generate with:
#   python Experiments/generate_configs.py Experiments/snowmelt \
#       Experiments/snowmelt/conf/base_config.yaml Experiments/snowmelt/conf/generated
#
# Spatial resolution: data.downsample of the 10 m rasters (plus a 4 px zero border)
#   1 -> 10 m, 517x514    2 -> 20 m, 258x257    4 -> 40 m, 129x128
#   8 -> 80 m, 64x64      16 -> 160 m, 32x32
#
# Temporal resolution: run.t is the NCA step count of the reference (median,
# 20-day) interval, i.e. t/20 steps per day. The v2 acquisitions used (the
# base config skips the first two) are 30, 20, 5, 20, 20, 30, 25 days apart
# (150 days):
#   interval_mode=uniform -> every transition runs t steps
#   interval_mode=steps   -> transitions run t * (days / 20) steps, 7.5 t in total
# The (downsample, t) pairs below keep t proportional to 1/h (convective
# scaling), so each step spans the same fraction of a pixel.
#
# Total jobs: 5 (downsample, t) pairs * 3 repeats = 15.
grid:
  model.family: [gNCA]
  run.interval_mode: [steps]
  run.repeat: [0, 1, 2]
  logging.wandb.project: [nca_snowmelt_hyperparameter_sweep]
  labels.gpu: [H200]
  system.precision: [bfloat16]
  data.dataset: [snowmelt]
  data.snowmelt.static_channels: [[DEM, SLOPE, NORTHNESS, EASTNESS]]
  data.snowmelt.target_channels: [[NDSI]]
  model.channels: [32]
groups:
  # Target sets, each paired with a channel budget:
  # targets + hidden + 5 boundary channels (catchment, DEM, slope, aspect x2).
  # - data.snowmelt.target_channels:
  #     # - [SCA]
  #     - [NDSI]
  #     # - [NDSI, B3, B11]
  #     # - [B2, B3, B4, B8, B11, B12]
  #   # model.channels: [16, 16, 16, 24]
  - data.downsample: [16, 8, 4, 2, 1]
    run.t: [32, 64, 128, 256, 512]
    trainer.loop_autodiff: [lax,lax,lax,checkpointed,checkpointed]
