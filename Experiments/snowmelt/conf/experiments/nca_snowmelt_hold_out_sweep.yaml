experiment_name: nca_snowmelt_hold_out_sweep
entrypoint: Experiments.snowmelt.train:run
output_subdir: generated/nca_snowmelt_hold_out_sweep
seed_mode: index

# Does the snowmelt NCA interpolate between acquisitions? Each run leaves one
# date out of training (data.snowmelt.hold_out_dates), so the dates either side
# of it form one longer training interval. Evaluation puts the date back and
# scores it separately (held_out column of Experiments/snowmelt/evaluation.py:score).
# Fixed model and inputs: gNCA, 32 channels, [ID, LAP, GRAD], target NDSI,
# static DEM, SLOPE, NORTHNESS, EASTNESS, 20 m.
#
# Generate with:
#   python Experiments/generate_configs.py \
#       Experiments/snowmelt/conf/experiments/nca_snowmelt_hold_out_sweep.yaml \
#       Experiments/snowmelt/conf/base_config.yaml Experiments/snowmelt/conf/generated
#
# Dates are indices into the 10 v2 acquisitions. 0 and 1 are always excluded
# (data.snowmelt.exclude_dates in the base config), so 2 is the initial
# condition and cannot be held out. Days since date 2, and the training
# interval each hold-out creates:
#   date   3   4   5   6   7    8    9
#   day   30  50  55  75  95  125  150
#   gap   50  25  25  40  50   55   (none: training ends at day 125)
# []  is the control (all dates trained on). [9] drops the last date, so it
# tests extrapolation (a 25-day forecast) rather than interpolation.
#
# run.reference_interval is fixed at 20 days (base config), so every run uses
# the same steps per day whichever date is held out.
#
# Total jobs: 8 hold-out sets * 3 repeats = 24.
grid:
  model.family: [gNCA]
  model.channels: [32]
  model.kernel_str: [[ID, LAP, GRAD]]
  model.fire_rate: [0.5]
  run.interval_mode: [steps]
  run.repeat: [0, 1, 2]
  logging.wandb.project: [nca_snowmelt_hyperparameter_sweep]
  labels.gpu: [H200]
  system.precision: [bfloat16]
  data.dataset: [snowmelt]
  data.snowmelt.target_channels: [[NDSI]]
  data.snowmelt.static_channels: [[DEM, SLOPE, NORTHNESS, EASTNESS]]
  data.snowmelt.hold_out_dates:
    - []
    - [3]
    - [4]
    - [5]
    - [6]
    - [7]
    - [8]
    - [9]
  # Baseline resolution: 20 m.
  data.downsample: [4]
  run.t: [128]
  trainer.loop_autodiff: [lax]
