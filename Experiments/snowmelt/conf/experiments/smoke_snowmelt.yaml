# Pipeline smoke test: two very short snowmelt runs at 80 m resolution
# (64x64) on dataset v2, covering single and multi-band targets, the v2 static
# channels (slope and aspect), uniform and step-scaled time intervals, both
# loop_autodiff modes and bundle publication.
# Run all smoke tests with:
#   python Experiments/pipeline_smoke_test.py
experiment_name: smoke_snowmelt
entrypoint: Experiments.snowmelt.train:run
output_subdir: generated/smoke_snowmelt
seed_mode: fixed

grid:
  logging.wandb.project: [pipeline-smoke]
  model_store.collection: [pipeline-smoke]
  data.dataset: [snowmelt]
  data.downsample: [8]
  model.channels: [16]
  run.t: [16]
  run.iterations: [60]
  # Checkpoint warmup: must end before run.iterations so a bundle is published.
  run.checkpoint_warmup_fraction: [0.1]
  optimiser.warmup_fraction: [0.2]
  trainer.log_every: [20]

# One entry per column: each block is zipped, not a Cartesian product.
groups:
  - model.family: [NCA, gNCA]
    data.snowmelt.target_channels:
      - [SCA]
      - [NDSI, B3, B11]
    data.snowmelt.static_channels:
      - [DEM]
      - [DEM, SLOPE, NORTHNESS, EASTNESS]
    run.interval_mode: [steps, uniform]
    trainer.loop_autodiff: [checkpointed, lax]
