schema_version: 7
seed: 0

experiment:
  name: nca_snowmelt_template

system:
  precision: highest
  xla_flags: null

labels:
  scaling: convective
  gpu: null

data:
  dataset: snowmelt
  batches: 1
  # 517x514 at 10 m -> 129x128 at 40 m (plus the zero border below).
  downsample: 4
  snowmelt:
    # Folder holding the dataset versions (v1/, v2/). Null falls back to
    # $SNOWMELT_DATA_ROOT, then $DATA_PATH_BASE/snowmelt.
    root: null
    # v1: 5 dates (May-July 2018). v2: 10 dates (April-September 2018), plus slope and aspect.
    version: v2
    # Dynamic channels the NCA reproduces: any of B1..B12, B8A, NDSI, NDVI, SCA.
    # Reflectance is clipped to [0, 1]; NDSI/NDVI are mapped from [-1, 1].
    target_channels: [SCA]
    # Fixed per-pixel inputs in the final state channels, after the catchment mask.
    # v1: DEM, INCIDENCE. v2: DEM, SLOPE, NORTHNESS, EASTNESS (cos/sin of aspect).
    static_channels: [DEM]
    pad: 4
    mask_threshold: 0.5
    # Acquisitions never used, as indices into the dataset's dates (negative
    # counts from the end) or ISO dates. The first two v2 dates have patchy
    # cloud cover and brightness artefacts, so the sequence starts at the third.
    exclude_dates: [0, 1]
    # Acquisitions left out of training but scored at evaluation, given the same
    # way (see nca_snowmelt_hold_out_sweep.yaml).
    hold_out_dates: []
    noise_strength: 0.005
    reinjection_probability: 0.5

model:
  family: NCA
  # 1 target + hidden + 2 boundary channels (catchment, DEM).
  channels: 16
  kernel_str: [ID, LAP, GRAD] # Direction matters for geospatial data
  fire_rate: 0.5
  padding: CIRCULAR

trainer:
  # Soft boundary writes the catchment/terrain channels after every step.
  boundary_mode: soft
  grad_loss: false
  log_directory: logs/
  loss_time_channel_mask: null
  loop_autodiff: checkpointed
  log_every: 100
  validation_every: null
  validation_rollout: false
  # Which rollouts are written back into the training pool.
  pool_admission:
    enabled: true
    relative_threshold: 1.25
    previous_relative_threshold: 1.10
    absolute_threshold: null
    ema_decay: 0.95
    # null means the same as run.checkpoint_warmup.
    warmup: null

optimiser:
  type: nadam
  blocknorm: true
  sam: false
  gradient_clip_norm: 1.0
  apply_if_finite: true
  max_consecutive_errors: 8
  learn_rate: 0.001
  warmup_steps: 64
  decay_rate: 0.99
  schedule:
    type: cosine
    warmup_init_lr: 1e-6
    final_factor: 0.1
    transition_fraction: 0.75

loss:
  terms:
    - type: l2
      weight: 1.0
  regularisers:
    intermediate_state: 1.0
    boundary: 5.0
    contiguous_growth: 0.0
    localised_hidden: 0.0
    update_sensitivity: 0.0
    perturbation_conservation: 0.0
    hidden_state_size: 0.0

run:
  mode: train
  # v2 acquisitions are 15, 5, 30, 20, 5, 20, 20, 30, 25 days apart. Without the
  # first two (data.snowmelt.exclude_dates) that leaves 30, 20, 5, 20, 20, 30, 25
  # (150 days). With interval_mode=steps, t is the step count of the reference
  # interval: steps = (96, 64, 16, 64, 64, 96, 80), 480 in total.
  t: 64
  interval_mode: steps
  # 20 days, the median interval. Set explicitly so that holding out dates
  # (which merges intervals) does not change the steps per day.
  reference_interval: 20
  interval_steps: null
  iterations: 4000
  # The best checkpoint is only saved after this many iterations.
  checkpoint_warmup: 64
  write_images: true
  write_videos: true

logging:
  backend: wandb
  singular_values:
    enabled: false
    plot_spectra: true
    epsilon: 1e-8
  wandb:
    project: NCA-snowmelt
    group: base-config
    tags: null
    # Settings whose values become automatic tags. Generated sweeps set this
    # to the settings their runs differ in; null tags every setting.
    tag_keys: null

model_store:
  enabled: true
  root: models
  collection: ${logging.wandb.project}
  model_factory: NCA.model.factory:build_model

initialization:
  model_id: null

