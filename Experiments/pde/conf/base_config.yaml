schema_version: 7
seed: 0

experiment:
  name: nca_pde_template

system:
  precision: highest
  xla_flags: null

data:
  dataset: pde
  # Number of simulated trajectories, each from a different initial condition.
  batches: 2
  downsample: 1
  pde:
    # gray_scott, chhabra, cahn_hilliard, heat, hillen_painter or keller_segel (PDE/catalogue.py).
    model: gray_scott
    # Overrides of the model defaults (see the model files in PDE/model/fixed_models/),
    # e.g. {alpha: 0.06, gamma: 0.062} for Gray-Scott feed and kill rates. Keep this
    # empty here: sweeps merge into it, so keys set here cannot be removed by a sweep.
    parameters: {}
    # PDE channels the NCA reproduces; the rest of the PDE state stays hidden. Empty means all.
    observed_channels: [A]
    size: 64
    padding: CIRCULAR
    dx: 1.0
    dt: 0.5
    solver: heun
    # 12 frames evenly spaced over [0, t_end]; the first is the initial condition.
    t_end: 5000
    frames: 12
    # uniform, square, gray_scott_shapes or gray_scott_spots.
    initial_condition: gray_scott_shapes
    initial_condition_scale: 1.0
    initial_condition_offset: 0.0
    initial_condition_blur: 0
    normalisation: minmax
    # Seed for the initial conditions, shared by all models in a sweep.
    seed: 0
    noise_strength: 0.001
    reinjection_probability: 0.5

model:
  family: NCA
  channels: 16
  kernel_str: [ID, LAP]
  activation: relu
  fire_rate: 1.0
  padding: CIRCULAR
  kernel_scale: 1

trainer:
  boundary_mode: soft
  grad_loss: true
  log_directory: logs/
  loss_time_channel_mask: null
  loop_autodiff: checkpointed
  log_every: 100
  # Which rollouts are written back into the training pool.
  pool_admission:
    enabled: true
    relative_threshold: 1.25
    previous_relative_threshold: 1.10
    absolute_threshold: null
    ema_decay: 0.95
    # null means the same as run.checkpoint_warmup.
    warmup: null

optimiser:
  type: nadam
  blocknorm: true
  sam: false
  gradient_clip_norm: 1.0
  apply_if_finite: true
  max_consecutive_errors: 8
  learn_rate: 0.001
  warmup_steps: 64
  decay_rate: 0.99
  schedule:
    type: exponential
    warmup_init_lr: 1e-6
    final_factor: 0.1
    transition_fraction: 0.75

loss:
  terms:
    - type: euclidean
      weight: 1.0
  regularisers:
    intermediate_state: 1.0
    boundary: 0.0
    contiguous_growth: 0.0
    localised_hidden: 0.0
    update_sensitivity: 0.0
    perturbation_conservation: 0.0
    hidden_state_size: 0.0

run:
  mode: train
  # NCA steps between consecutive frames.
  t: 32
  iterations: 4000
  # The best checkpoint is only saved after this many iterations.
  checkpoint_warmup: 64
  write_images: true
  write_videos: true

logging:
  backend: wandb
  wandb:
    project: NCA-PDEs
    group: base-config
    tags: null
    # Settings whose values become automatic tags. Generated sweeps set this
    # to the settings their runs differ in; null tags every setting.
    tag_keys: null

model_store:
  enabled: true
  root: models
  collection: ${logging.wandb.project}
  model_factory: NCA.model.factory:build_model
