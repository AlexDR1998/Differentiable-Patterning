# Pipeline smoke test: two very short PDE runs on 32x32 grids, covering a
# 2-channel PDE with one hidden PDE channel and a 1-channel PDE, both
# loop_autodiff modes and bundle publication.
# Run all smoke tests with:
#   python Experiments/pipeline_smoke_test.py
experiment_name: smoke_pde
entrypoint: Experiments.pde.train:run
output_subdir: generated/smoke_pde
seed_mode: fixed

grid:
  logging.wandb.project: [pipeline-smoke]
  model_store.collection: [pipeline-smoke]
  data.dataset: [pde]
  data.pde.size: [32]
  data.pde.frames: [6]
  model.channels: [8]
  run.t: [16]
  run.iterations: [60]
  # Checkpoint warmup: must be below run.iterations so a bundle is published.
  run.checkpoint_warmup: [5]
  optimiser.warmup_steps: [10]
  trainer.log_every: [20]

# One entry per column: each block is zipped, not a Cartesian product.
groups:
  - model.family: [NCA, gNCA]
    data.pde.model: [gray_scott, cahn_hilliard]
    data.pde.parameters:
      - {alpha: 0.0623, gamma: 0.06268}
      - {D: 0.1}
    data.pde.observed_channels:
      - [A]
      - []
    data.pde.dt: [0.5, 0.1]
    data.pde.t_end: [2000, 500]
    data.pde.initial_condition: [gray_scott_shapes, uniform]
    data.pde.initial_condition_scale: [1.0, 2.0]
    data.pde.initial_condition_offset: [0.0, -1.0]
    trainer.loop_autodiff: [checkpointed, lax]
